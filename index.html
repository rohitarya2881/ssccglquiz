<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Board</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#181A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --board:#181A20;
    --board-dark:#101115;
    --board-light:#22252C;
    --chalk:#ECEDEF;
    --chalk-dim:#8B93A1;
    --chalk-yellow:#F0B429;
    --pen-red:#F16A63;
    --pen-green:#4ADE80;
    --wood:#2E313A;
    --wood-dark:#1B1D22;
    --card-bg:#1C1F26;
    --card-text:#ECEDEF;
    --card-border:#333640;
    --card-muted:#8B93A1;
    --font-display:'Kalam',cursive;
    --font-body:'Space Grotesk',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top, #262933 0%, #181A20 55%, #0C0D10 100%);
    font-family:var(--font-body);
    color:var(--chalk);
    padding:20px;
  }
  #app{max-width:1100px;margin:0 auto;}
  a{color:inherit;}
  button, input, select, textarea{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--chalk-yellow); outline-offset:2px;}

  .board-frame{
    background:linear-gradient(180deg,var(--board) 0%, var(--board-dark) 100%);
    border:14px solid var(--wood);
    border-radius:10px;
    box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 0 60px rgba(0,0,0,.35);
    padding:32px 28px 40px;
    position:relative;
  }
  .board-frame::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-14px; height:14px;
    background:var(--wood-dark);
    border-radius:0 0 10px 10px;
  }
  .header{text-align:center; margin-bottom:28px;}
  .header h1{
    font-family:var(--font-display); font-weight:700; font-size:2.4rem; color:var(--chalk);
    margin:0 0 4px; text-shadow:0 0 14px rgba(237,234,216,.15); letter-spacing:.5px;
  }
  .header p{color:var(--chalk-dim); font-size:.95rem; margin:0;}
  .chalk-underline{width:120px;height:3px;margin:10px auto 0;background:var(--chalk-yellow);border-radius:2px;opacity:.7;}

  /* HOME */
  .home-doors{display:flex; gap:24px; flex-wrap:wrap; justify-content:center; margin-top:20px;}
  .door{
    flex:1 1 280px; max-width:340px; background:var(--board-light); border:2px dashed var(--chalk-dim);
    border-radius:12px; padding:30px 24px; text-align:center; transition:transform .15s ease, border-color .15s ease;
  }
  .door:hover{transform:translateY(-4px); border-color:var(--chalk-yellow);}
  .door .icon{font-size:2.6rem; display:block; margin-bottom:10px;}
  .door h2{font-family:var(--font-display); font-size:1.5rem; margin:0 0 8px; color:var(--chalk-yellow);}
  .door p{color:var(--chalk-dim); font-size:.9rem; margin:0 0 18px; min-height:40px;}

  .btn{
    display:inline-block; background:var(--chalk-yellow); color:#2B2210; border:none; padding:11px 20px;
    border-radius:7px; font-weight:600; font-size:.92rem; transition:filter .15s ease, transform .1s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent; color:var(--chalk); border:1.5px solid var(--chalk-dim);}
  .btn.secondary:hover{border-color:var(--chalk-yellow); color:var(--chalk-yellow);}
  .btn.danger{background:var(--pen-red); color:#fff;}
  .btn.small{padding:6px 12px; font-size:.8rem;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .sp{flex:1;}

  /* PIN GATE */
  .gate-box{
    max-width:360px; margin:30px auto; background:var(--board-light);
    border:1px solid var(--chalk-dim); border-radius:12px; padding:26px; text-align:center;
  }
  .gate-box input{
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--card-border);
    background:var(--card-bg); color:var(--card-text); font-size:1rem; margin:14px 0; text-align:center; letter-spacing:3px;
  }
  .gate-box input[type=text]:not(#pinInput), .gate-box input[type=password]{letter-spacing:normal;}
  .auth-tabs{display:flex; gap:6px; justify-content:center; margin-top:14px;}
  .auth-tab{
    background:transparent; border:1.5px solid var(--chalk-dim); color:var(--chalk-dim);
    padding:7px 18px; border-radius:20px; font-size:.82rem; font-weight:600;
  }
  .auth-tab.active{background:var(--chalk-yellow); border-color:var(--chalk-yellow); color:#2B2210;}

  /* ====== EXPLORER (admin file manager) ====== */
  .explorer{background:var(--board-light); border:1px solid rgba(237,234,216,.15); border-radius:12px; padding:16px;}
  .crumbs{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.95rem;
    background:var(--board-dark); border:1px solid var(--card-border); border-radius:8px; padding:8px 12px; margin-bottom:14px;
  }
  .crumbs a{cursor:pointer; color:var(--chalk); padding:2px 6px; border-radius:5px; overflow-wrap:anywhere;}
  .crumbs a:hover{background:rgba(240,180,41,.15); color:var(--chalk-yellow);}
  .crumbs a.cur{color:var(--chalk-yellow); font-weight:700; cursor:default;}
  .crumbs a.cur:hover{background:none;}
  .crumbs span{color:var(--chalk-dim);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .item{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:16px 10px 8px;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:130px;
    transition:border-color .12s ease, transform .12s ease; min-width:0;
  }
  .item:hover{border-color:var(--chalk-yellow); transform:translateY(-2px);}
  .ico{font-size:42px; line-height:1;}
  .nm{font-size:.9rem; text-align:center; overflow-wrap:anywhere; flex:1; display:flex; align-items:center; font-weight:600;}
  .item .meta{font-size:.72rem; color:var(--card-muted);}
  .acts{display:flex; gap:2px;}
  .icon-btn{background:transparent; border:none; color:var(--chalk-dim); font-size:17px; padding:4px 8px; border-radius:6px;}
  .icon-btn:hover{color:var(--chalk); background:rgba(237,234,216,.1);}
  .icon-btn.del:hover{color:var(--pen-red);}
  .empty{text-align:center; color:var(--chalk-dim); padding:50px 10px; font-size:.95rem;}
  .empty .big{font-size:2.6rem; display:block; margin-bottom:8px;}

  .section-title{font-family:var(--font-display); font-size:1.3rem; color:var(--chalk-yellow); margin:0 0 12px;}

  /* CARDS (quizzes) */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .quiz-card{
    background:var(--card-bg); color:var(--card-text); border-radius:10px; padding:16px;
    border:1px solid var(--card-border); box-shadow:0 3px 0 rgba(0,0,0,.15);
    display:flex; flex-direction:column; gap:8px; transition:transform .12s ease, box-shadow .12s ease;
  }
  .quiz-card:hover{transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,.18);}
  .quiz-card h3{margin:0; font-size:1.02rem;}
  .badge{
    display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:20px;
    background:var(--board); color:var(--chalk-yellow); width:fit-content; text-transform:uppercase; letter-spacing:.5px;
  }
  .code-box{
    font-family:var(--font-mono); font-weight:700; background:var(--board); color:var(--chalk-yellow);
    padding:6px 10px; border-radius:6px; letter-spacing:2px; text-align:center; font-size:.95rem;
  }
  .quiz-card .meta{font-size:.78rem; color:var(--card-muted);}
  .quiz-card .actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; padding-top:8px; border-top:1px dashed var(--card-border);}
  .quiz-card .actions .btn{flex:1 1 auto; text-align:center;}

  /* FORMS */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:.85rem; color:var(--chalk-dim); margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--card-border);
    background:var(--card-bg); color:var(--card-text); font-size:.92rem;
  }
  .field textarea{font-family:var(--font-mono); font-size:.82rem; min-height:180px; resize:vertical;}
  .hint{font-size:.78rem; color:var(--chalk-dim); margin-top:6px;}
  .range-row{display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;}
  .range-row .field{flex:1 1 120px; margin-bottom:0;}
  .example-box{
    background:var(--board-dark); border:1px dashed var(--chalk-dim); border-radius:8px; padding:12px;
    font-family:var(--font-mono); font-size:.72rem; color:var(--chalk-dim); white-space:pre-wrap; margin-top:8px; display:none;
  }
  .example-box.open{display:block;}
  .preview-line{font-size:.82rem; color:var(--pen-green); margin-top:6px; min-height:18px;}
  .preview-line.err{color:var(--pen-red);}

  /* MODAL */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:14px; z-index:900;}
  .modal{background:var(--board-light); border:1px solid var(--chalk-dim); border-radius:14px; padding:20px; width:100%; max-width:420px;}
  .modal h3{margin:0 0 14px; font-family:var(--font-display); color:var(--chalk-yellow); font-size:1.3rem;}
  .modal input{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--card-border);
    background:var(--card-bg); color:var(--card-text); font-size:1rem;
  }
  .modal.wide{max-width:560px; max-height:92vh; overflow:auto;}
  .modal select{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--card-text); margin-bottom:10px;}
  .modal textarea{width:100%; min-height:180px; padding:10px 12px; border-radius:8px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--card-text); font-family:var(--font-mono); font-size:.8rem; resize:vertical;}
  .modal .row{justify-content:flex-end; margin-top:16px;}

  /* QUIZ ATTEMPT */
  .quiz-title{font-family:var(--font-display); font-size:1.6rem; color:var(--chalk-yellow); margin:0 0 4px;}
  .q-card{
    background:var(--card-bg); color:var(--card-text); border-radius:10px; padding:18px 20px; margin-bottom:16px;
    border:1px solid var(--card-border);
  }
  .q-num{font-family:var(--font-mono); font-weight:700; color:var(--pen-red); font-size:.85rem; margin-bottom:6px;}
  .q-text{font-size:1.02rem; font-weight:600; margin-bottom:14px;}
  .opt{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border:1.5px solid var(--card-border);
    margin-bottom:8px; cursor:pointer; transition:border-color .12s ease, background .12s ease;
    background:#171A1F; color:var(--card-text);
  }
  .opt:hover{border-color:var(--chalk-yellow);}
  .opt.selected{border-color:var(--chalk-yellow); background:rgba(232,196,104,.16); font-weight:600;}
  .opt .letter{
    width:24px; height:24px; border-radius:50%; border:1.5px solid var(--card-border); display:flex; align-items:center; justify-content:center;
    font-size:.75rem; font-weight:700; flex:0 0 auto; color:var(--card-text);
  }
  .opt.selected .letter{background:var(--chalk-yellow); color:#2B2210; border-color:var(--chalk-yellow);}
  .opt.correct{border-color:var(--pen-green); background:rgba(116,192,143,.16);}
  .opt.correct .letter{background:var(--pen-green); border-color:var(--pen-green); color:#0c2013;}
  .opt.wrong-picked{border-color:var(--pen-red); background:rgba(224,101,90,.16);}
  .opt.wrong-picked .letter{background:var(--pen-red); border-color:var(--pen-red); color:#2b0c0a;}
  .mark{font-weight:700; margin-left:auto; font-family:var(--font-display); font-size:1.1rem;}
  .mark.ok{color:var(--pen-green);}
  .mark.bad{color:var(--pen-red);}
  .explain{margin-top:10px; font-size:.85rem; color:var(--card-text); background:rgba(232,196,104,.1); padding:10px 12px; border-radius:8px; border-left:3px solid var(--chalk-yellow);}

  .passage-box{font-size:1rem; line-height:2.1;}
  .blank-select{
    font-family:inherit; font-weight:700; border:none; border-bottom:2px solid var(--pen-red); background:rgba(232,196,104,.14); color:var(--card-text);
    padding:2px 6px; border-radius:4px; margin:0 2px; font-size:.95rem;
  }
  .blank-select.ok-blank{border-bottom-color:var(--pen-green); background:rgba(116,192,143,.16);}
  .blank-select.bad-blank{border-bottom-color:var(--pen-red); background:rgba(224,101,90,.16);}

  .sticky-submit{
    position:sticky; bottom:0; background:var(--board-dark); padding:14px; border-radius:10px; margin-top:10px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    border:1px solid rgba(237,234,216,.2);
  }
  .score-banner{background:var(--chalk-yellow); color:#2B2210; border-radius:12px; padding:22px; text-align:center; margin-bottom:20px;}
  .score-banner .big{font-family:var(--font-display); font-size:2.4rem; font-weight:700;}

  .attempt-layout{display:flex; gap:18px; align-items:flex-start;}
  .attempt-main{flex:1; min-width:0;}
  .palette-box{
    flex:0 0 220px; background:var(--board-light); border-radius:10px; padding:14px;
    border:1px solid rgba(237,234,216,.15); position:sticky; top:14px;
  }
  .palette-box h4{margin:0 0 10px; font-size:.82rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:.5px;}
  .palette-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px;}
  .pnum{
    aspect-ratio:1/1; border-radius:6px; border:1.5px solid var(--chalk-dim); background:transparent; color:var(--chalk);
    font-family:var(--font-mono); font-size:.78rem; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .pnum.answered{background:var(--pen-green); border-color:var(--pen-green); color:#0c2013;}
  .pnum.current{outline:2px solid var(--chalk-yellow); outline-offset:1px;}
  .palette-legend{font-size:.72rem; color:var(--chalk-dim); display:flex; flex-direction:column; gap:4px;}
  .palette-legend span{display:flex; align-items:center; gap:6px;}
  .legend-dot{width:10px; height:10px; border-radius:3px; display:inline-block; border:1.5px solid var(--chalk-dim);}
  .legend-dot.answered{background:var(--pen-green); border-color:var(--pen-green);}
  .qnav-row{display:flex; justify-content:space-between; gap:10px; margin-top:14px; flex-wrap:wrap;}
  @media(max-width:760px){ .attempt-layout{flex-direction:column; align-items:stretch;} .palette-box{position:static; width:100%; flex:none;} .attempt-main{width:100%;} }

  /* LEADERBOARD */
  .lb-table{width:100%; border-collapse:collapse; margin-top:6px; font-size:.88rem;}
  .lb-table th, .lb-table td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--card-border); color:var(--card-text);}
  .lb-table th{color:var(--card-muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.4px;}
  .lb-row-me{background:rgba(232,196,104,.16); font-weight:700;}
  .lb-rank{font-family:var(--font-mono); font-weight:700;}
  .lb-table-wrap{overflow-x:auto;}

  /* HISTORY */
  .hist-item{
    background:var(--card-bg); color:var(--card-text); border-radius:10px; padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--card-border); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .hist-item .name{font-weight:700;}
  .hist-item .sub{font-size:.78rem; color:var(--card-muted);}
  .hist-score{font-family:var(--font-mono); font-weight:700; font-size:1rem; display:flex; flex-direction:column; align-items:flex-end; gap:3px;}
  .rank-pill{font-family:var(--font-mono); font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:20px; background:var(--board); color:var(--chalk-yellow); letter-spacing:.3px;}
  .rank-pill.top3{background:var(--chalk-yellow); color:#2B2210;}

  .user-badge{text-align:center; font-size:.8rem; color:var(--chalk-dim); margin:-14px 0 20px;}
  .user-badge b{color:var(--chalk-yellow);}
  .user-badge button{background:none; border:none; color:var(--chalk-dim); text-decoration:underline; cursor:pointer; font-size:.78rem; padding:0; margin-left:6px;}

  .bank-box{background:var(--board-dark); border:1px solid rgba(237,234,216,.15); border-radius:10px; padding:14px; margin-bottom:16px;}
  .bank-status{font-size:.85rem; color:var(--pen-green); margin-bottom:8px;}
  .bank-status.empty{color:var(--chalk-dim);}

  /* PROFILE */
  .profile-card{
    display:flex; align-items:center; gap:16px; background:var(--board-light); border:1px solid rgba(237,234,216,.15);
    border-radius:12px; padding:18px 20px; margin-bottom:18px; flex-wrap:wrap;
  }
  .profile-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--chalk-yellow); color:#2B2210;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:1.6rem; font-weight:700; flex:0 0 auto;
  }
  .profile-info{flex:1; min-width:120px;}
  .profile-name{font-family:var(--font-display); font-size:1.3rem; color:var(--chalk-yellow);}
  .profile-sub{font-size:.78rem; color:var(--chalk-dim);}
  .profile-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px;}
  .stat-box{background:var(--board-light); border:1px solid rgba(237,234,216,.15); border-radius:10px; padding:14px; text-align:center;}
  .stat-num{font-family:var(--font-display); font-size:1.5rem; color:var(--chalk-yellow);}
  .stat-label{font-size:.72rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}
  @media(max-width:480px){ .profile-stats{grid-template-columns:1fr 1fr;} }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--board-dark); color:var(--chalk); padding:10px 18px; border-radius:8px;
    border:1px solid var(--chalk-yellow); font-size:.85rem; z-index:999; box-shadow:0 6px 20px rgba(0,0,0,.4);
  }


  .hist-actions{flex:1 1 100%; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-top:1px dashed var(--card-border); padding-top:8px;}
  .lb-me{background:rgba(240,180,41,.14); border:1px solid var(--chalk-yellow); border-radius:8px; padding:8px 12px; margin-bottom:10px; font-size:.88rem;}
  .banner-sub{font-size:.85rem; margin-top:6px; opacity:.85; font-family:var(--font-mono);}
  .profile-actions{flex:1 1 100%; display:flex; gap:8px; flex-wrap:wrap; border-top:1px dashed rgba(237,234,216,.2); padding-top:10px;}
  .modal label{display:block; font-size:.78rem; color:var(--chalk-dim); margin:12px 0 4px;}
  /* history card (compact, mobile friendly) */
  .hg-top{align-items:flex-start; flex-wrap:nowrap;}
  .hg-title{min-width:0; flex:1;}
  .hg-title .name{overflow-wrap:anywhere; line-height:1.3;}
  .hg-top .rank-pill{flex:0 0 auto; white-space:nowrap; margin-top:2px;}
  .hg-stats{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .hg-lbl{font-size:.68rem; text-transform:uppercase; letter-spacing:.4px; color:var(--card-muted); margin-right:2px;}
  .hg-chip{font-family:var(--font-mono); font-size:.78rem; font-weight:700; padding:2px 9px; border-radius:20px; background:rgba(237,234,216,.07); border:1px solid var(--card-border);}
  .hg-chip.main{background:rgba(240,180,41,.14); border-color:var(--chalk-yellow); color:var(--chalk-yellow);}
  .hg-actions{display:flex; gap:8px; flex-wrap:nowrap;}
  .hg-actions .btn{flex:1 1 0; min-width:0; text-align:center; white-space:nowrap; padding-left:8px; padding-right:8px;}
  /* history groups */
  .hist-item.hgroup{display:block;}
  .hg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .hg-list{display:none; margin-top:8px; border-top:1px dashed var(--card-border); padding-top:6px;}
  .hgroup.open .hg-list{display:block; max-height:260px; overflow-y:auto; overscroll-behavior:contain;}
  .hgroup .hist-actions{margin-top:10px;}

async function testSbConnection(){

async function sGet(key){

  try{

}

}

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------------- utils ---------------- */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

  const o = document.createElement('div');
  o.className = 'overlay';

}

let structureCache = null;
async function getStructure(){
  if(structureCache) return structureCache;
  let s = await sGet('structure');

  structureCache = s;
  return s;

  structureCache = tree;

function findNode(nodes, id){
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    if(n.id===id) return {node:n, list:nodes, index:i};
    if(n.type==='folder' && n.children){
      const found = findNode(n.children, id);
      if(found) return found;
    }
  }
  return null;
}
function pathToNode(nodes, id, trail){
  trail = trail || [];
  for(const n of nodes){
    const t = trail.concat([n]);
    if(n.id===id) return t;
    if(n.type==='folder' && n.children){
      const found = pathToNode(n.children, id, t);
      if(found) return found;
    }
  }
  return null;
}

async function submitNameGate(){
  const mode = state.authMode || 'login';
  const errEl = document.getElementById('authErr');
  errEl.textContent='';

  const rawUsername = document.getElementById('usernameInput').value.trim();
  const pass = document.getElementById('passInput').value;

  if(!rawUsername){ errEl.textContent='Enter a username first'; return; }
  if(/\s/.test(rawUsername)){ errEl.textContent='Username can\'t contain spaces'; return; }
  if(!pass){ errEl.textContent='Enter a password too'; return; }

  const userKey = rawUsername.toLowerCase();
  const acctKey = 'account:' + userKey;
  const passHash = await sha256Hex(pass);
  const existing = await sGet(acctKey);

  if(mode==='login'){
    if(!existing){ errEl.textContent = 'No account with that username yet — switch to Sign up.'; return; }
    if(existing.passHash !== passHash){ errEl.textContent = 'Wrong password for that username.'; return; }
    state.userKey = userKey;
    state.userName = existing.displayName || rawUsername;
  } else {
    const displayName = (document.getElementById('displayInput').value || '').trim();
    if(!displayName){ errEl.textContent='Enter a display name too'; return; }
    if(existing){ errEl.textContent = 'That username is already taken — switch to Log in, or pick a different username.'; return; }
    const ok = await sSet(acctKey, {username:userKey, displayName, passHash, createdAt:Date.now()});
    if(!ok){ errEl.textContent='Could not create account — check the connection banner.'; return; }
    state.userKey = userKey;
    state.userName = displayName;
    toast('Account created — welcome, '+displayName+'!');
  }
  saveUserSession(state.userKey, state.userName);
  const next = state.afterNameGate;
  state.afterNameGate = null;
  if(next) next(); else render();
}
function changeUserName(){
  if(!confirm('Log out of "'+state.userName+'"? You\'ll need your password to log back in.')) return;
  state.userKey = null;
  state.userName = null;
  clearUserName();
  goHome();
}

async function submitPin(isSettingUp){
  const val = document.getElementById('pinInput').value.trim();
  if(!val){ toast('Enter a PIN first'); return; }
  if(isSettingUp){
    const freshCfg = await sGet('config');
    if(freshCfg && freshCfg.adminPin){
      toast('⚠ Admin is already set up on this app — not accepting new admin.');
      state._settingPin = false;
      state.view = 'admin-gate';
      render();
      return;
    }

function sortNodes(list){
  return list.slice().sort((a,b)=> a.type===b.type ? a.name.localeCompare(b.name) : (a.type==='folder' ? -1 : 1));

function adminGo(id){ state.adminSelectedChapter=null; state.adminSelectedFolder=id||null; render(); }

async function adminUp(){
  const tree = await getStructure();
  const target = state.adminSelectedChapter || state.adminSelectedFolder;

}

async function renderAdmin(){
  if(!state.adminUnlocked){ state.view='admin-gate'; return renderAdminGate(); }
  const tree = await getStructure();

  // clean up stale selections (e.g. something got deleted)
  if(state.adminSelectedChapter && !findNode(tree, state.adminSelectedChapter)) state.adminSelectedChapter = null;
  if(state.adminSelectedFolder && !findNode(tree, state.adminSelectedFolder)) state.adminSelectedFolder = null;

  const target = state.adminSelectedChapter || state.adminSelectedFolder;
  const path = target ? (pathToNode(tree, target)||[]) : [];

  const crumbs = [`<a onclick="adminGo(null)" class="${!path.length?'cur':''}">🏠 Root</a>`]
    .concat(path.map((n,i)=>{
      const last = i===path.length-1;
      const icon = n.type==='folder' ? '' : '📄 ';
      return `<span>›</span><a class="${last?'cur':''}" ${last?'':`onclick="adminGo('${n.id}')"`}>${icon}${escapeHtml(n.name)}</a>`;
    })).join('');

  let body = '';
  let actionBtns = '';
  if(state.adminSelectedChapter){
    body = await renderChapterAdmin(state.adminSelectedChapter, tree);
  } else {
    let items;
    if(state.adminSelectedFolder){
      const f = findNode(tree, state.adminSelectedFolder);
      items = sortNodes(f.node.children || []);
    } else {
      items = sortNodes(tree);
    }
    actionBtns = `
      <button class="btn small" onclick="newFolderHere()">📁 New folder</button>
      <button class="btn small" onclick="newChapterHere()">📄 New file</button>`;

async function deleteNode(id){
  const tree = await getStructure();
  const found = findNode(tree, id);
  if(!found) return;
  const what = found.node.type==='folder' ? ' and everything inside it' : ' and all its quizzes';
  if(!confirm(`Delete "${found.node.name}"${what}? This cannot be undone.`)) return;
  const quizIds=[], chapterIds=[];
  (function walk(n){
    if(n.type==='chapter'){ chapterIds.push(n.id); (n.quizzes||[]).forEach(q=>quizIds.push(q.id)); }
    else if(n.children){ n.children.forEach(walk); }
  })(found.node);
  for(const qid of quizIds) await sDelete('quiz:'+qid);
  for(const cid of chapterIds) await sDelete('bank:'+cid);
  const wasOpenPath = pathToNode(tree, id) || [];
  found.list.splice(found.index,1);
  await saveStructure(tree);

  // if the current location was inside the deleted node, step out
  const parent = wasOpenPath.length>=2 ? wasOpenPath[wasOpenPath.length-2] : null;
  if(state.adminSelectedChapter && !findNode(tree, state.adminSelectedChapter)){
    state.adminSelectedChapter = null;
    state.adminSelectedFolder = parent ? parent.id : null;
  }
  if(state.adminSelectedFolder && !findNode(tree, state.adminSelectedFolder)){
    state.adminSelectedFolder = parent ? parent.id : null;
  }
  toast('Deleted');
  render();
}

async function deleteQuiz(quizId){
  if(!confirm('Delete this quiz?')) return;
  const tree = await getStructure();
  const chFound = findNode(tree, state.adminSelectedChapter);
  if(chFound){
    chFound.node.quizzes = (chFound.node.quizzes||[]).filter(q=>q.id!==quizId);
    await saveStructure(tree);
  }
  await sDelete('quiz:'+quizId);
  toast('Quiz deleted');
  render();
}

/* ---------------- FILE (question bank) + QUIZ CREATION ---------------- */
const MCQ_EXAMPLE = `[
  {
    "question": "What is the capital of France?",
    "options": ["Berlin", "Madrid", "Paris", "Rome"],
    "correctIndex": 2,
    "explanation": "Paris is the capital of France."
  }
]`;
const CLOZE_EXAMPLE = `{
  "passage": "The mitochondria is the ___1___ of the cell, and it produces ___2___.",
  "blanks": [
    { "options": ["nucleus", "powerhouse", "wall"], "correctIndex": 1, "explanation": "" },
    { "options": ["ATP", "DNA", "RNA"], "correctIndex": 0, "explanation": "" }
  ]
}`;

function parseBank(type, raw){
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ throw new Error('Invalid JSON: '+e.message); }
  if(type==='mcq'){
    if(!Array.isArray(parsed) || !parsed.length) throw new Error('Expected a JSON array of questions');
    parsed.forEach((q,i)=>{
      if(!q.question || !Array.isArray(q.options) || typeof q.correctIndex!=='number')
        throw new Error('Question '+(i+1)+' is missing question / options / correctIndex');
    });
    return {data:parsed, count:parsed.length};
  }
  if(!parsed.passage || !Array.isArray(parsed.blanks)) throw new Error('Need "passage" and "blanks" fields');
  const tokens = (parsed.passage.match(/___(\d+)___/g)||[]).length;
  if(tokens !== parsed.blanks.length) throw new Error(`Passage has ${tokens} blank marker(s) but "blanks" has ${parsed.blanks.length}`);
  return {data:parsed, count:parsed.blanks.length};
}

// create a new file (name + JSON) or replace JSON of an existing file
function openFileModal(parentId, fileId){
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="modal wide"><h3>${fileId ? 'Replace JSON' : '📄 New file'}</h3>
    ${fileId ? '' : `<input id="fmName" type="text" maxlength="80" placeholder="File name e.g. Minerals" autocomplete="off" style="margin-bottom:10px;">`}
    <select id="fmType"><option value="mcq">Standard MCQ</option><option value="cloze">Passage / Cloze test</option></select>
    <textarea id="fmJson" placeholder="Paste your JSON here…"></textarea>
    <div class="row" style="justify-content:flex-start; margin-top:8px;">
      <input id="fmFile" type="file" accept=".json,application/json,text/plain" style="flex:1; min-width:0;">
      <button class="btn secondary small" type="button" id="fmEx">Example</button>
    </div>
    <div class="example-box" id="fmExBox"></div>
    <div class="preview-line" id="fmPrev"></div>
    <div class="row"><button class="btn secondary" data-x>Cancel</button><button class="btn" data-ok>${fileId ? 'Replace' : 'Create file'}</button></div></div>`;
  document.body.appendChild(o);
  const $ = sel => o.querySelector(sel);
  const close = ()=>o.remove();
  const preview = ()=>{
    const raw = $('#fmJson').value, pv = $('#fmPrev');
    if(!raw.trim()){ pv.textContent=''; return; }
    try{ const r = parseBank($('#fmType').value, raw); pv.className='preview-line'; pv.textContent = `✓ ${r.count} ${$('#fmType').value==='mcq'?'question(s)':'blank(s)'} found`; }
    catch(e){ pv.className='preview-line err'; pv.textContent='⚠ '+e.message; }

// create a quiz straight from the open file's saved questions
async function createQuizFromFile(chapterId){

  if(!bank){ toast('Upload JSON to this file first'); return; }
  const name = document.getElementById('qzName').value.trim();
  if(!name){ toast('Give the quiz a name'); return; }
  const type = bank.type;
  let quizData;
  if(type==='mcq'){
    const all = bank.data;
    let from = parseInt(document.getElementById('rangeFrom').value,10) || 1;
    let to = parseInt(document.getElementById('rangeTo').value,10) || all.length;
    if(from<1) from=1;
    if(to>all.length) to=all.length;
    if(from>to){ toast('"From" must be less than or equal to "To"'); return; }
    quizData = {type:'mcq', questions: all.slice(from-1,to).map(q=>({question:q.question, options:q.options, correctIndex:q.correctIndex, explanation:q.explanation||''}))};
  } else {
    quizData = {type:'cloze', passage:bank.data.passage, blanks:bank.data.blanks.map(b=>({options:b.options, correctIndex:b.correctIndex, explanation:b.explanation||''}))};
  }
  const code = genCode();
  const count = type==='mcq' ? quizData.questions.length : quizData.blanks.length;
  const tRaw = parseInt(document.getElementById('timeLimitInput').value,10);
  const timeLimitMinutes = tRaw>0 ? tRaw : null;
  const negMarking = parseFloat(document.getElementById('negInput').value) || 0;
  const rec = Object.assign({id:code, name, createdAt:Date.now(), chapterId, attempts:[], timeLimitMinutes, negMarking}, quizData);
  if(!(await sSet('quiz:'+code, rec))){ toast('Could not save quiz — try again'); return; }
  const tree = await getStructure();
  const f = findNode(tree, chapterId);
  if(f){
    f.node.quizzes = f.node.quizzes || [];
    f.node.quizzes.push({id:code, name, type, count, createdAt:Date.now(), timeLimitMinutes, negMarking});

  }
  toast('Quiz created! Code: '+code);
  render();
}

/* ---------------- SHUFFLE ---------------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleQuizForAttempt(quiz){
  const cloned = JSON.parse(JSON.stringify(quiz));
  if(cloned.type==='mcq' && Array.isArray(cloned.questions)){
    cloned.questions = shuffleArray(cloned.questions).map(q=>{
      const order = shuffleArray(q.options.map((_,i)=>i));
      const newOptions = order.map(i=>q.options[i]);
      const newCorrect = order.indexOf(q.correctIndex);
      return Object.assign({}, q, {options:newOptions, correctIndex:newCorrect});
    });
  } else if(cloned.type==='cloze' && Array.isArray(cloned.blanks)){
    cloned.blanks = cloned.blanks.map(b=>{
      const order = shuffleArray(b.options.map((_,i)=>i));
      const newOptions = order.map(i=>b.options[i]);
      const newCorrect = order.indexOf(b.correctIndex);
      return Object.assign({}, b, {options:newOptions, correctIndex:newCorrect});
    });
  }
  return cloned;
}

/* ---------------- TIMER ---------------- */
function clearAttemptTimer(){
  if(state.timerInterval){ clearInterval(state.timerInterval); state.timerInterval=null; }
  state.attemptDeadline = null;
}
function startAttemptTimer(){
  if(state.timerInterval) return;
  state.timerInterval = setInterval(tickAttemptTimer, 1000);
  tickAttemptTimer();
}
function tickAttemptTimer(){
  if(!state.attemptDeadline){ return; }
  const remain = state.attemptDeadline - Date.now();
  const el = document.getElementById('timerDisplay');
  if(remain<=0){
    if(el){ el.textContent='00:00'; }
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    toast("⏱ Time's up — auto-submitting");
    if(state.view==='attempt') submitQuiz(true);
    return;
  }
  if(el){
    const mm = Math.floor(remain/60000);
    const ss = Math.floor((remain%60000)/1000);
    el.textContent = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    el.classList.toggle('timer-warn', remain<=60000);
  }
}

function formatRemaining(){
  if(!state.attemptDeadline) return '--:--';
  const remain = Math.max(0, state.attemptDeadline - Date.now());
  const mm = Math.floor(remain/60000);
  const ss = Math.floor((remain%60000)/1000);
  return String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}

function renderClozePassage(quiz, showAnswers){
  let idx = 0;
  return quiz.passage.replace(/___(\d+)___/g, ()=>{
    const blankIndex = idx; idx++;
    const blank = quiz.blanks[blankIndex];
    const selected = state.answers[blankIndex];
    let cls = 'blank-select';
    if(showAnswers){
      if(selected===blank.correctIndex) cls += ' ok-blank'; else cls += ' bad-blank';
    }
    const opts = blank.options.map((o,oi)=>`<option value="${oi}" ${selected===oi?'selected':''}>${escapeHtml(o)}</option>`).join('');
    const disabled = showAnswers ? 'disabled' : '';
    return `<select class="${cls}" ${disabled} onchange="pickAnswer(${blankIndex}, parseInt(this.value,10))"><option value="" ${selected===undefined?'selected':''} disabled>choose</option>${opts}</select>`;
  });
}

function pickAnswer(index, optionIndex){
  state.answers[index] = optionIndex;
  render();
}

function r2(n){ return Math.round(n*100)/100; }
function fmtMarks(n){ return String(r2(n)); }
function fmtTime(sec){
  if(sec===undefined || sec===null || !isFinite(sec)) return '—';
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), r = sec%60;
  return m+':'+String(r).padStart(2,'0');
}
function computeScore(quiz, answers){
  const items = quiz.type==='mcq' ? quiz.questions : quiz.blanks;
  const total = items.length;
  let correct = 0, wrong = 0;
  items.forEach((q,i)=>{
    const a = answers[i];
    if(a===undefined) return;
    if(a===q.correctIndex) correct++; else wrong++;
  });
  const neg = quiz.negMarking || 0;
  const marks = r2(correct - wrong*neg);
  return {correct, wrong, skipped: total-correct-wrong, total, neg, marks, pct: total ? Math.round((marks/total)*100) : 0};
}

async function submitQuiz(force){
  const quiz = state.currentQuiz;
  const total = quiz.type==='mcq' ? quiz.questions.length : quiz.blanks.length;
  const answered = Object.keys(state.answers).length;
  if(!force && answered < total){
    if(!confirm(`You've only answered ${answered} of ${total}. Submit anyway?`)) return;
  }
  clearAttemptTimer();
  const sc = computeScore(quiz, state.answers);
  const timeTaken = Math.min(Math.round((Date.now()-(state.attemptStart||Date.now()))/1000), quiz.timeLimitMinutes ? quiz.timeLimitMinutes*60 : Infinity);

  const freshQuiz = (await sGet('quiz:'+quiz.id)) || quiz;
  freshQuiz.attempts = freshQuiz.attempts || [];
  if(quiz.type==='mcq') freshQuiz.questions = quiz.questions;
  else freshQuiz.blanks = quiz.blanks;
  const attemptRecord = {
    id: uid('att'),
    userKey: state.userKey || null,
    userName: state.userName || 'Anonymous',
    score: sc.marks, correct: sc.correct, wrong: sc.wrong, neg: sc.neg, total: sc.total, pct: sc.pct, timeTaken, submittedAt: Date.now()
  };
  freshQuiz.attempts.push(attemptRecord);
  await sSet('quiz:'+quiz.id, freshQuiz);
  state.currentQuiz = freshQuiz;

  if(state.userKey){
    const histKey = 'history:'+state.userKey;
    const hist = (await sGet(histKey)) || [];
    hist.push({
      quizId: quiz.id, quizName: quiz.name, chapterId: quiz.chapterId,
      score: sc.marks, correct: sc.correct, wrong: sc.wrong, total: sc.total, pct: sc.pct, timeTaken, submittedAt: Date.now()
    });
    if(hist.length>1500) hist.splice(0, hist.length-1500);
    await sSet(histKey, hist);
  }

  state.submitted = true;
  state.lastTimeTaken = timeTaken;
  state.reviewQ = 0;
  state.reviewFilter = wrongFirst(quiz);
  state.view = 'result';
  render();
}

/* ---------------- RANKING helpers ---------------- */
function cmpAttempts(a,b){
  // 1) more marks  2) less time taken  3) earlier submission
  const ta = a.timeTaken==null ? Infinity : a.timeTaken;
  const tb = b.timeTaken==null ? Infinity : b.timeTaken;
  return (b.score-a.score) || (ta===tb ? 0 : (ta<tb ? -1 : 1)) || (a.submittedAt-b.submittedAt);
}
function bestAttemptsRanked(quiz){
  const attempts = quiz.attempts || [];
  const bestByUser = {};
  attempts.forEach(a=>{
    const key = a.userKey || ('name:'+(a.userName||'Anonymous').toLowerCase());
    const cur = bestByUser[key];
    if(!cur || cmpAttempts(a,cur)<0) bestByUser[key]=a;
  });
  return Object.entries(bestByUser)
    .map(([key,a])=>Object.assign({_key:key}, a))
    .sort(cmpAttempts);
}
function getUserRankInQuiz(quiz, userKey){
  if(!quiz) return null;
  const ranked = bestAttemptsRanked(quiz);
  const idx = ranked.findIndex(a=>a.userKey===userKey);
  if(idx===-1) return null;
  return {rank: idx+1, total: ranked.length};
}

/* ---------------- RESULT ---------------- */
function renderLeaderboard(quiz, compact){
  const attempts = quiz.attempts || [];
  if(!attempts.length) return '';
  const ranked = bestAttemptsRanked(quiz);
  let show = ranked.map((a,idx)=>({a,idx}));
  if(compact){
    const top = show.slice(0,10);
    const me = state.userKey ? show.find(x=>x.a.userKey===state.userKey) : null;
    if(me && me.idx>=10) top.push(me);
    show = top;
  }
  const rows = show.map(({a,idx})=>{
    const isMe = state.userKey ? (a.userKey===state.userKey) : false;
    const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
    return `<tr class="${isMe?'lb-row-me':''}">
      <td class="lb-rank">${medal||('#'+(idx+1))}</td>
      <td>${escapeHtml(a.userName||'Anonymous')}${isMe?' (you)':''}</td>
      <td>${fmtMarks(a.score)}/${a.total}</td>
      <td>${fmtTime(a.timeTaken)}</td>
      <td>${new Date(a.submittedAt).toLocaleDateString()}</td>
    </tr>`;
  }).join('');
  const table = `<div class="lb-table-wrap"><table class="lb-table">
        <thead><tr><th>Rank</th><th>Name</th><th>Score</th><th>Time</th><th>Date</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  if(compact==='bare') return table;
  if(!compact){
    return `<div class="q-card"><div class="section-title" style="font-size:1.1rem;">🏆 Leaderboard</div>${table}</div>`;
  }
  return `<details class="q-card lb-details" open>
    <summary>🏆 Leaderboard <span class="hint" style="display:inline;">(${ranked.length} player${ranked.length===1?'':'s'}${ranked.length>10?' · top 10 shown':''})</span></summary>
    ${table}</details>`;
}

/* ---------------- RESULT (summary + one-at-a-time review) ---------------- */
function wrongFirst(quiz){
  // open review on the wrong answers by default when there are any (most useful for learning)
  if(quiz.type!=='mcq') return 'all';
  const anyBad = quiz.questions.some((q,i)=>state.answers[i]!==undefined && state.answers[i]!==q.correctIndex);
  return anyBad ? 'wrong' : 'all';
}
function reviewStatus(q, i){
  const p = state.answers[i];
  return p===undefined ? 'skip' : (p===q.correctIndex ? 'ok' : 'bad');
}
function reviewFilterList(quiz){
  const want = {all:null, wrong:'bad', correct:'ok', skipped:'skip'}[state.reviewFilter];
  return quiz.questions.map((q,i)=>i).filter(i=>!want || reviewStatus(quiz.questions[i], i)===want);
}
async function reviewGo(i){
  state.reviewQ = i;
  await render();
  const el = document.getElementById('reviewTop');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function reviewStep(d){
  const quiz = state.currentQuiz;
  const list = reviewFilterList(quiz);
  const np = list.indexOf(state.reviewQ) + d;
  if(np<0 || np>=list.length) return;
  reviewGo(list[np]);
}
function setReviewFilter(f){
  state.reviewFilter = f;
  const list = reviewFilterList(state.currentQuiz);
  state.reviewQ = list.length ? list[0] : 0;
  render();
}
function reviewGridPick(i){
  const quiz = state.currentQuiz;
  if(state.reviewFilter!=='all' && !reviewFilterList(quiz).includes(i)) state.reviewFilter='all';
  reviewGo(i);
}

function renderResult(){

async function openLeaderboardDialog(quizId){
  const quiz = await sGet('quiz:'+quizId);
  if(!quiz){ toast('Quiz not found — it may have been removed'); return; }
  const ranked = bestAttemptsRanked(quiz);
  const idx = state.userKey ? ranked.findIndex(a=>a.userKey===state.userKey) : -1;
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="modal wide">
    <h3>🏆 ${escapeHtml(quiz.name)}</h3>
    ${idx>=0 ? `<div class="lb-me">Your rank: <b>#${idx+1}</b> of ${ranked.length} &nbsp;·&nbsp; ${fmtMarks(ranked[idx].score)}/${ranked[idx].total} &nbsp;·&nbsp; ⏱ ${fmtTime(ranked[idx].timeTaken)}</div>` : ''}
    ${ranked.length ? renderLeaderboard(quiz,'bare') : '<p class="hint">No attempts yet.</p>'}
    <p class="hint" style="margin-top:10px;">Each player's best attempt counts · more marks first, then less time.</p>
    <div class="row"><button class="btn secondary" data-x>Close</button><button class="btn" data-re>🔁 Reattempt</button></div>
  </div>`;
  document.body.appendChild(o);
  const close = ()=>o.remove();
  o.querySelector('[data-x]').onclick = close;
  o.querySelector('[data-re]').onclick = ()=>{ close(); startQuiz(quizId); };
  o.addEventListener('mousedown', e=>{ if(e.target===o) close(); });
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown', esc); } });
}

/* ---------------- ACCOUNT SETTINGS (name / password) ---------------- */
function accountModal(title, bodyHtml, okText, onOk){
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="modal"><h3>${title}</h3>${bodyHtml}
    <div class="preview-line err" id="acctErr" style="margin-top:8px;"></div>
    <div class="row"><button class="btn secondary" data-x>Cancel</button><button class="btn" data-ok>${okText}</button></div></div>`;
  document.body.appendChild(o);
  const close = ()=>o.remove();
  const err = msg => { o.querySelector('#acctErr').textContent = msg; };
  const okBtn = o.querySelector('[data-ok]');
  const submit = async ()=>{
    err('');
    okBtn.disabled = true;
    try{ const done = await onOk(o, err); if(done) close(); }
    catch(e){ err(e.message || 'Something went wrong'); }
    okBtn.disabled = false;
  };
  o.querySelector('[data-x]').onclick = close;
  okBtn.onclick = submit;
  o.addEventListener('mousedown', e=>{ if(e.target===o) close(); });
  o.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); if(e.key==='Escape') close(); });
  const first = o.querySelector('input'); if(first){ first.focus(); first.select && first.select(); }
}

function openChangeName(){
  if(!state.userKey) return;
  accountModal('✎ Change display name',
    `<label>New display name (shown on leaderboards)</label>
     <input id="newNameInput" type="text" maxlength="30" value="${escapeHtml(state.userName)}" autocomplete="off">`,
    'Save', async (o, err)=>{
      const name = o.querySelector('#newNameInput').value.trim();
      if(!name){ err('Enter a name'); return false; }
      if(name===state.userName){ err('That is already your display name'); return false; }
      const acctKey = 'account:'+state.userKey;
      const account = await sGet(acctKey);
      if(!account){ err('Account not found'); return false; }
      account.displayName = name;
      if(!(await sSet(acctKey, account))){ err('Could not save — check the connection'); return false; }
      const oldName = state.userName;
      state.userName = name;
      saveUserSession(state.userKey, name);
      // refresh the name shown on leaderboards of quizzes this user already attempted (best effort)
      try{
        const hist = (await sGet('history:'+state.userKey)) || [];
        const ids = [...new Set(hist.map(h=>h.quizId))];
        for(const id of ids){
          const q = await sGet('quiz:'+id);
          if(!q || !Array.isArray(q.attempts)) continue;
          let changed = false;
          q.attempts.forEach(a=>{ if(a.userKey===state.userKey && a.userName!==name){ a.userName = name; changed = true; } });
          if(changed) await sSet('quiz:'+id, q);
        }
      }catch(e){ console.error(e); }
      toast('Display name changed to '+name);
      render();
      return true;
    });
}

function openChangePassword(){
  if(!state.userKey) return;
  accountModal('🔑 Change password',
    `<label>Current password</label>
     <input id="oldPw" type="password" maxlength="60" autocomplete="current-password">
     <label>New password (min 4 characters)</label>
     <input id="newPw" type="password" maxlength="60" autocomplete="new-password">
     <label>Confirm new password</label>
     <input id="newPw2" type="password" maxlength="60" autocomplete="new-password">`,
    'Change password', async (o, err)=>{
      const oldPw = o.querySelector('#oldPw').value;
      const newPw = o.querySelector('#newPw').value;
      const newPw2 = o.querySelector('#newPw2').value;
      if(!oldPw){ err('Enter your current password'); return false; }
      if(newPw.length<4){ err('New password must be at least 4 characters'); return false; }
      if(newPw!==newPw2){ err('New passwords do not match'); return false; }
      if(newPw===oldPw){ err('New password must be different from the current one'); return false; }
      const acctKey = 'account:'+state.userKey;
      const account = await sGet(acctKey);
      if(!account){ err('Account not found'); return false; }
      if(account.passHash !== await sha256Hex(oldPw)){ err('Current password is wrong'); return false; }
      account.passHash = await sha256Hex(newPw);
      if(!(await sSet(acctKey, account))){ err('Could not save — check the connection'); return false; }
      toast('Password changed ✓');
      return true;
    });
}

/* ---------------- PROFILE ---------------- */
/* ---- activity calendar helpers ---- */
// quizzes submitted in a day -> shade. Edit these numbers to change the colour levels:
// 1-3 quizzes = level 1, 4-5 = level 2, 6-7 = level 3, 8-9 = level 4, 10+ = level 5
const CAL_LEVELS = [1,4,6,8,10];
const CAL_WEEKS = 26;
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calLevel(n){ let lv=0; CAL_LEVELS.forEach((t,i)=>{ if(n>=t) lv=i+1; }); return lv; }
function calToast(label,n){ toast(n ? `${n} quiz${n===1?'':'zes'} on ${label}` : `No quiz on ${label}`); }
function computeStreaks(counts){
  const today = new Date(); today.setHours(0,0,0,0);
  const has = d => (counts[dayKey(d)]||0) > 0;
  // current streak: counts back from today (or from yesterday if nothing yet today)
  let cur = 0; const d = new Date(today);
  if(!has(d)) d.setDate(d.getDate()-1);
  while(has(d)){ cur++; d.setDate(d.getDate()-1); }
  // longest streak
  const keys = Object.keys(counts).filter(k=>counts[k]>0).sort();
  let longest = 0, run = 0, prev = null;
  keys.forEach(k=>{
    const [y,m,dd] = k.split('-').map(Number);
    const dt = new Date(y,m-1,dd);
    if(prev && Math.round((dt-prev)/86400000)===1) run++; else run = 1;
    if(run>longest) longest = run;
    prev = dt;
  });
  return {current:cur, longest, activeDays:keys.length, today: counts[dayKey(today)]||0};
}
function renderCalendar(counts){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(today);
  start.setDate(start.getDate() - (CAL_WEEKS-1)*7);
  start.setDate(start.getDate() - ((start.getDay()+6)%7)); // back to Monday
  const cells = []; const months = [];
  let lastMonth = -1, week = 0;
  for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){
    const dow = (d.getDay()+6)%7;
    if(dow===0){
      week = Math.round((d-start)/(7*86400000));
      if(d.getMonth()!==lastMonth){ months.push({week, name:d.toLocaleString('en',{month:'short'})}); lastMonth = d.getMonth(); }
    }
    const k = dayKey(d), n = counts[k]||0;
    const label = d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    cells.push(`<div class="cal-cell lv${calLevel(n)}" title="${n} quiz${n===1?'':'zes'} on ${label}" onclick="calToast('${label}',${n})"></div>`);
  }
  const weeks = week+1;
  const legend = CAL_LEVELS.map((t,i)=>{
    const next = CAL_LEVELS[i+1];
    const txt = next ? (next-1>t ? t+'–'+(next-1) : String(t)) : t+'+';
    return `<span class="cal-leg"><i class="cal-cell lv${i+1}"></i>${txt}</span>`;
  }).join('');
  return `
    <div class="cal-wrap">
      <div class="cal-scroll" id="calScroll">
        <div class="cal-inner" style="--weeks:${weeks};">
          <div class="cal-months">${months.map(m=>`<span style="left:calc(${m.week} * var(--cell-step));">${m.name}</span>`).join('')}</div>
          <div class="cal-body">
            <div class="cal-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
            <div class="cal-grid">${cells.join('')}</div>
          </div>
        </div>
      </div>
      <div class="cal-legend"><span class="hint" style="margin:0;">Quizzes per day:</span><span class="cal-leg"><i class="cal-cell lv0"></i>0</span>${legend}</div>
    </div>`;
}

async function renderProfile(){
  if(!state.userKey) return `<p class="hint">Not logged in.</p>`;
  const [account, hist] = await Promise.all([
    sGet('account:'+state.userKey),
    sGet('history:'+state.userKey)
  ]);
  const all = (hist||[]).slice().sort((a,b)=> b.submittedAt-a.submittedAt);
  const attempted = all.length;
  const avgPct = attempted ? Math.round(all.reduce((s,h)=>s+h.pct,0)/attempted) : 0;
  const bestPct = attempted ? Math.max(...all.map(h=>h.pct)) : 0;
  const initial = state.userName.trim().charAt(0).toUpperCase();
  const memberSince = account && account.createdAt ? new Date(account.createdAt).toLocaleDateString() : '—';

  // per-day counts for calendar + streaks
  const counts = {};
  all.forEach(h=>{ const k = dayKey(new Date(h.submittedAt)); counts[k] = (counts[k]||0)+1; });
  const st = computeStreaks(counts);

  // group attempts by quiz
  const groups = {};
  all.forEach(h=>{ (groups[h.quizId] = groups[h.quizId] || []).push(h); });
  const groupList = Object.keys(groups).map(id=>{
    const list = groups[id]; // newest first
    const best = list.slice().sort(cmpAttempts)[0];
    return {id, list, best, last:list[0]};
  }).sort((a,b)=> b.last.submittedAt - a.last.submittedAt);

  const quizMap = {};
  const quizResults = await Promise.all(groupList.map(g=>sGet('quiz:'+g.id)));
  groupList.forEach((g,i)=>{ quizMap[g.id] = quizResults[i]; });

  const historyHtml = groupList.length ? groupList.map(g=>{
    const quiz = quizMap[g.id];
    const rankInfo = getUserRankInQuiz(quiz, state.userKey);
    const rankHtml = rankInfo
      ? `<span class="rank-pill ${rankInfo.rank<=3?'top3':''}">${rankInfo.rank<=3 ? (rankInfo.rank===1?'🥇 ':rankInfo.rank===2?'🥈 ':'🥉 ') : ''}#${rankInfo.rank} of ${rankInfo.total}</span>`
      : `<span class="rank-pill">rank —</span>`;
    const n = g.list.length, b = g.best;
    const rows = g.list.map((h,i)=>`
      <div class="att-row ${h===b?'best':''}">
        <span class="att-no">#${n-i}</span>
        <span class="att-when">${new Date(h.submittedAt).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</span>
        <span class="att-score">${fmtMarks(h.score)}/${h.total} · ${h.pct}%</span>
        <span class="att-time">${h.timeTaken!=null?'⏱ '+fmtTime(h.timeTaken):''}</span>
        ${h===b?'<span class="att-star" title="Best attempt">★</span>':'<span class="att-star"></span>'}
      </div>`).join('');
    return `
    <div class="hist-item hgroup">
      <div class="hg-top" ${n>1?'onclick="toggleHistGroup(this)" style="cursor:pointer;"':''}>
        <div class="hg-title">
          <div class="name">${escapeHtml(g.last.quizName)}</div>
          <div class="sub">${n} attempt${n===1?'':'s'} · last ${new Date(g.last.submittedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
        </div>
        ${rankHtml}
      </div>
      <div class="hg-stats">
        <span class="hg-lbl">${n>1?'Best':'Score'}</span>
        <span class="hg-chip main">${fmtMarks(b.score)}/${b.total}</span>
        <span class="hg-chip">${b.pct}%</span>
        ${b.timeTaken!=null?`<span class="hg-chip">⏱ ${fmtTime(b.timeTaken)}</span>`:''}
      </div>
      <div class="hist-actions hg-actions">
        ${quiz
          ? `<button class="btn small" onclick="startQuiz('${g.id}')">🔁 Reattempt</button>
             <button class="btn secondary small" onclick="openLeaderboardDialog('${g.id}')">🏆 Ranks</button>`
          : `<span class="hint" style="margin:0; flex:1;">Quiz removed by admin</span>`}
        ${n>1 ? `<button class="btn secondary small hg-toggle" onclick="toggleHistGroup(this)">Attempts <span class="chev">▾</span></button>` : ''}
      </div>
      ${n>1 ? `<div class="hg-list">${rows}</div>` : ''}
    </div>`;
  }).join('') : `<p class="hint">No quizzes attempted yet — take one and it'll show up here.</p>`;

  return `
    <div class="toolbar">
      <button class="btn secondary small" onclick="goHome()">⟵ Home</button>
    </div>
    <div class="profile-card">
      <div class="profile-avatar">${escapeHtml(initial)}</div>
      <div class="profile-info">
        <div class="profile-name">${escapeHtml(state.userName)}</div>
        <div class="profile-sub">@${escapeHtml(state.userKey)} · Member since ${memberSince}</div>
      </div>
      <button class="btn danger small" onclick="changeUserName()">Logout</button>
      <div class="profile-actions">
        <button class="btn secondary small" onclick="openChangeName()">✎ Change display name</button>
        <button class="btn secondary small" onclick="openChangePassword()">🔑 Change password</button>
      </div>
    </div>
    <div class="profile-stats">
      <div class="stat-box"><div class="stat-num">${attempted}</div><div class="stat-label">Attempts</div></div>
      <div class="stat-box"><div class="stat-num">${avgPct}%</div><div class="stat-label">Average score</div></div>
      <div class="stat-box"><div class="stat-num">${bestPct}%</div><div class="stat-label">Best score</div></div>
    </div>
    <div class="section-title" style="margin-top:8px;">🔥 Activity</div>
    <div class="res-stats">
      <div class="stat-box"><div class="stat-num">${st.current}</div><div class="stat-label">Current streak (days)</div></div>
      <div class="stat-box"><div class="stat-num">${st.longest}</div><div class="stat-label">Longest streak</div></div>
      <div class="stat-box"><div class="stat-num">${st.activeDays}</div><div class="stat-label">Active days</div></div>
      <div class="stat-box"><div class="stat-num">${st.today}</div><div class="stat-label">Quizzes today</div></div>
    </div>
    ${renderCalendar(counts)}
    <div class="section-title" style="margin-top:14px;">🏆 Quiz History <span class="hint" style="display:inline; margin-left:6px;">${groupList.length} quiz${groupList.length===1?'':'zes'}</span></div>
    ${historyHtml}
  `;
}

/* ---------------- PDF (print) ---------------- */
function printNow(html, title){
  const area = document.getElementById('print-area');
  area.innerHTML = `<h1>${escapeHtml(title)}</h1>${html}`;
  window.print();
}

async function downloadBlankPdf(quizId){
  const quiz = await sGet('quiz:'+quizId);
  if(!quiz){ toast('Quiz not found'); return; }
  let html='';
  if(quiz.type==='mcq'){
    html = quiz.questions.map((q,i)=>`
      <div class="p-q"><b>${i+1}. ${escapeHtml(q.question)}</b><br>
      ${q.options.map((o,oi)=>`<div class="p-opt">${String.fromCharCode(65+oi)}. ${escapeHtml(o)}</div>`).join('')}
      </div>`).join('');
  } else {
    html = `<p>${quiz.passage.replace(/___(\d+)___/g,'______')}</p>`;
  }
  printNow(html, quiz.name);
}

async function downloadAnswerKeyPdf(quizId){
  const quiz = await sGet('quiz:'+quizId);
  if(!quiz){ toast('Quiz not found'); return; }
  let html='';
  if(quiz.type==='mcq'){
    html = quiz.questions.map((q,i)=>`
      <div class="p-q"><b>${i+1}. ${escapeHtml(q.question)}</b><br>
      <div class="p-opt p-correct">Answer: ${escapeHtml(q.options[q.correctIndex])}</div>
      ${q.explanation ? `<div><i>${escapeHtml(q.explanation)}</i></div>` : ''}
      </div>`).join('');
  } else {
    let idx=0;
    const passageHtml = quiz.passage.replace(/___(\d+)___/g, ()=>{
      const b = quiz.blanks[idx]; idx++;
      return `<span class="p-correct">${escapeHtml(b.options[b.correctIndex])}</span>`;
    });
    html = `<div class="p-q">${passageHtml}</div>
      ${quiz.blanks.map((b,i)=>b.explanation ? `<div><i>Blank ${i+1}: ${escapeHtml(b.explanation)}</i></div>` : '').join('')}`;
  }
  printNow(html, quiz.name + ' — Answer Key');
}

function downloadResultPdf(){
  const quiz = state.currentQuiz;
  let correct=0, total=0, html='';
  if(quiz.type==='mcq'){
    total = quiz.questions.length;
    html = quiz.questions.map((q,i)=>{
      const picked = state.answers[i];
      if(picked===q.correctIndex) correct++;
      return `<div class="p-q"><b>${i+1}. ${escapeHtml(q.question)}</b><br>
        ${q.options.map((o,oi)=>{
          let cls = oi===q.correctIndex ? 'p-correct' : (oi===picked ? 'p-wrong':'');
          return `<div class="p-opt ${cls}">${String.fromCharCode(65+oi)}. ${escapeHtml(o)}${oi===q.correctIndex?' (correct)':''}${oi===picked && picked!==q.correctIndex?' (your answer)':''}</div>`;
        }).join('')}
        ${q.explanation?`<div><i>${escapeHtml(q.explanation)}</i></div>`:''}
      </div>`;
    }).join('');
  } else {
    total = quiz.blanks.length;
    quiz.blanks.forEach((b,i)=>{ if(state.answers[i]===b.correctIndex) correct++; });
    let idx=0;
    const passageHtml = quiz.passage.replace(/___(\d+)___/g, ()=>{
      const b = quiz.blanks[idx]; const sel = state.answers[idx]; idx++;
      const correctTxt = b.options[b.correctIndex];
      const selTxt = sel!==undefined ? b.options[sel] : '(blank)';
      return sel===b.correctIndex ? `<span class="p-correct">${escapeHtml(correctTxt)}</span>` : `<span class="p-wrong">${escapeHtml(selTxt)}</span> [correct: ${escapeHtml(correctTxt)}]`;
    });
    html = `<div class="p-q">${passageHtml}</div>`;
  }
  const sc = computeScore(quiz, state.answers);
  const scoreLine = `<p><b>Score: ${fmtMarks(sc.marks)} / ${sc.total} (${sc.pct}%)</b> — ${sc.correct} correct, ${sc.wrong} wrong, ${sc.skipped} skipped${sc.neg?`, −${sc.neg} per wrong`:''}${state.lastTimeTaken!=null?`, time ${fmtTime(state.lastTimeTaken)}`:''}</p>`;
  printNow(scoreLine + html, quiz.name + ' — Result');
}
